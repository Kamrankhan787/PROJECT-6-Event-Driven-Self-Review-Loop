name: AI PR Self-Review Loop

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI Code Review (${{ github.event.action }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v

      - name: Identify PR and Commit
        id: pr_info
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" >> $GITHUB_OUTPUT
          echo "BASE_REF=${{ github.event.pull_request.base.ref }}" >> $GITHUB_OUTPUT
          echo "HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> $GITHUB_OUTPUT
          echo "EVENT_ACTION=${{ github.event.action }}" >> $GITHUB_OUTPUT
          echo "Running review for PR #${{ github.event.pull_request.number }} triggered by event: ${{ github.event.action }}"
          echo "Target commit SHA: ${{ github.event.pull_request.head.sha }}"

      - name: Generate PR Diff
        id: pr_diff
        run: |
          git fetch origin ${{ steps.pr_info.outputs.BASE_REF }}
          git diff origin/${{ steps.pr_info.outputs.BASE_REF }}...${{ steps.pr_info.outputs.HEAD_SHA }} > pr_diff.patch
          echo "Generated diff size: $(wc -c < pr_diff.patch) bytes"

      - name: Run AI Reviewer
        id: reviewer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/ai_reviewer.py \
            --commit-sha "${{ steps.pr_info.outputs.HEAD_SHA }}" \
            --base-ref "${{ steps.pr_info.outputs.BASE_REF }}" \
            --pr-number "${{ steps.pr_info.outputs.PR_NUMBER }}" \
            --repo "${{ github.repository }}" \
            --diff-file pr_diff.patch \
            --output-file review_result.md

      - name: Upload Review Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-review-${{ steps.pr_info.outputs.HEAD_SHA }}
          path: review_result.md
